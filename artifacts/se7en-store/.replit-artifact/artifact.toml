kind = "web"
previewPath = "/"
title = "Se7en Store"
description = "A responsive streetwear storefront for Se7en with product browsing, search, collections, cart, wishlist, and checkout presentation."
version = "1.0.0"
id = "artifacts/se7en-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20165

[services.development]
run = "pnpm --filter @workspace/se7en-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/se7en-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/se7en-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20165"
BASE_PATH = "/"
